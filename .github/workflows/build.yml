name: Build THE LAST PLAYER

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 1.16.5 / ForgeGradle 5 needs a Java 8 JDK
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # No gradle wrapper is committed, so we install Gradle 7.4.2 (works with ForgeGradle 5.1)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'

      - name: Build mod JAR
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-last-player-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Pushing a tag like  v1.0.0  creates a GitHub Release with the JAR attached
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
